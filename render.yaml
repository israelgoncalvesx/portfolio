services:
  - type: web
    name: israel-portfolio-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: CONTACT_LOG_PATH
        value: /tmp/contact_messages.jsonl
      - key: CONTACT_TO_EMAIL
        value: israelgoncalvesx@gmail.com
      - key: RESEND_FROM_EMAIL
        value: Portfolio <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
